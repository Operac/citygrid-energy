name: Update energy news archive

on:
  schedule:
    - cron: '17 5 * * *'
      timezone: 'Africa/Lagos'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citygrid-news-archive
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh archived headlines
        run: node scripts/update-news-archive.js

      - name: Commit new headlines
        run: |
          if git diff --quiet -- data/news-archive.json; then
            echo "No new headlines to archive."
            exit 0
          fi
          git config user.name "citygrid-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-archive.json
          git commit -m "Update energy news archive"
          git push
